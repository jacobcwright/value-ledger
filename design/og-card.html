<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ink:#25201e;--muted:#625953;--paper:#fbf8f2;--red:#9d271f;--night:#201c1b;--night-text:#fff8ed;--serif:Georgia,"Times New Roman",serif;--sans:"Inter","Aptos","Segoe UI",-apple-system,"Helvetica Neue",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#f3ebe0;color:var(--ink);font-family:var(--sans);border-top:10px solid var(--red);display:flex;flex-direction:column}
.main{flex:1;padding:44px 72px 0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;font:700 30px/1 var(--serif);letter-spacing:-.03em}
.brand img{width:50px;height:50px;display:block}
.eyebrow{margin:40px 0 0;display:flex;align-items:center;gap:14px;font-size:17px;font-weight:750;letter-spacing:.15em;color:var(--red)}
.eyebrow span{display:block;width:36px;height:2px;background:var(--red)}
h1{margin:14px 0 0;font:400 118px/.95 var(--serif);letter-spacing:-.065em}
h1 em{font-style:normal;font-weight:700;color:var(--red);letter-spacing:-.105em}
.dek{margin:22px 0 0;max-width:900px;font:400 33px/1.3 var(--serif);letter-spacing:-.01em;color:var(--ink)}
.band{background:var(--night);color:var(--night-text);display:grid;grid-template-columns:.7fr 1fr .8fr 1fr;padding:0 72px}
.stat{padding:26px 0 28px 26px;border-left:1px solid #4a3d38}
.stat:first-child{padding-left:0;border-left:0}
.stat strong{display:block;font:400 42px/1 var(--serif);letter-spacing:-.05em;white-space:nowrap}
.stat span{display:block;margin-top:9px;font-size:17px;color:#e6dccf}
.url{position:absolute;right:72px;top:56px;font-size:19px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
</style></head><body>
<div class="main">
<div class="brand"><img src="../dist/favicon.svg" alt="">Value for Humanity</div>
<p class="eyebrow"><span></span>THE 2025–26 EDITION</p>
<h1>The Business <em>100</em></h1>
<p class="dek">The builders whose companies employ 14.9 million people and create value shared by millions.</p>
</div>
<div class="url">valueforhumanity.com</div>
<div class="band">
<div class="stat"><strong>100</strong><span>Leaders profiled</span></div>
<div class="stat"><strong>$41.6 trillion</strong><span>Combined value created</span></div>
<div class="stat"><strong>14.9 million</strong><span>People employed</span></div>
<div class="stat"><strong>$1.2 trillion</strong><span>Annual pay to workers</span></div>
</div>
</body></html>
