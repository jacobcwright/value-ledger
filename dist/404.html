<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#9d271f">
<title>Page not found | Value for Humanity</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{color-scheme:light;--ink:#25201e;--muted:#625953;--paper:#fbf8f2;--line:#dfd7cc;--red:#9d271f;--red-dark:#84231b;--serif:Georgia,"Times New Roman",serif;--sans:"Inter","Aptos","Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#f3ebe0;color:var(--ink);font:16px/1.55 var(--sans);border-top:5px solid var(--red)}
.wrap{width:min(1200px,100% - 32px);margin:0 auto}
header{background:#fffdf7;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:11px;padding:18px 0;color:var(--ink);text-decoration:none;font:700 24px/1 var(--serif);letter-spacing:-.04em}
.brand img{width:34px;height:34px;display:block}
main{flex:1;display:flex;align-items:center}
.eyebrow{margin:0 0 18px;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:750;letter-spacing:.15em;color:var(--red)}
.eyebrow span{width:29px;height:2px;background:var(--red)}
h1{margin:0 0 20px;font:400 clamp(48px,9vw,96px)/.92 var(--serif);letter-spacing:-.06em}
p{max-width:34em;margin:0 0 28px;color:var(--muted);font-size:18px}
a.primary{display:inline-block;padding:12px 18px;background:var(--red);color:#fff8ef;font-weight:700;text-decoration:none;border-radius:2px;transition:background .18s}
a.primary:hover{background:var(--red-dark)}
a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.content{padding:64px 0 80px}
@media (prefers-reduced-motion:reduce){a.primary{transition:none}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/"><img src="/favicon.svg" alt="" width="34" height="34">Value for Humanity</a></div></header>
<main><div class="wrap content">
<p class="eyebrow"><span></span>PAGE NOT FOUND</p>
<h1>This page isn’t here.</h1>
<p>The link may be out of date. The Business 100 and every leader profile live on the home page.</p>
<a class="primary" href="/#ranking">Explore the ranking</a>
</div></main>
</body>
</html>
